# Use vim navigation for panes
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Enable mouse scroll
set -g mouse on

# Make the active pane's border stand out (tokyonight-moon palette)
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#82aaff'

# Match tokyonight-moon on the status bar
set -g status-style 'fg=#82aaff,bg=#1e2030'

# Show current git branch (if any) alongside the clock/date
set -g status-right "#(cd -- #{pane_current_path} && git branch --show-current 2>/dev/null) %H:%M %d-%b-%y"

# Split panes into the current pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Seamless pane navigation between tmux and Neovim splits
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
